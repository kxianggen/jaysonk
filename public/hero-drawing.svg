             C238 136 236 132 234 128
             Q232 134 229 137 Q227 131 224 127 Q221 134 217 138 Q215 131 212 128
             Q209 135 205 138 Q203 131 200 128 Q197 135 193 137 Q191 131 188 127
             Q185 133 181 136 Q179 130 176 127 Q173 132 169 134 Q167 131 165 129 Q163 135 161 142 Z"
