    <path d="M190 202 L196 212 M194 200 L200 210 M200 200 L205 209 M206 200 L209 206" stroke-width="0.9" opacity=".45"/>
    <!-- elbows reaching down to the keyboard -->
    <path d="M124 232 C118 252 122 270 134 282"/>
    <path d="M276 232 C282 252 278 270 266 282"/>

    <!-- neck -->
    <path d="M191 172 L190 190"/>
    <path d="M209 172 L210 190"/>

