    <path d="M160 156 C161 174 178 192 197 211" stroke-width="1.1"/>
    <path d="M240 156 C239 174 222 192 203 211" stroke-width="1.1"/>
    <path d="M200 216 L200 223" stroke-width="1.1"/>
    <rect x="197.2" y="209.5" width="5.6" height="7" rx="1.8" fill="#f4f4f2" stroke-width="1.1"/>
    <path d="M159.2 141 L158.6 157 L161.8 157 L162.4 141" fill="#f4f4f2" stroke-width="1.1"/>
    <path d="M240.8 141 L241.4 157 L238.2 157 L237.6 141" fill="#f4f4f2" stroke-width="1.1"/>
    <ellipse cx="161.2" cy="137.5" rx="5.2" ry="4.6" fill="#f4f4f2" stroke-width="1.3"/>
    <ellipse cx="238.8" cy="137.5" rx="5.2" ry="4.6" fill="#f4f4f2" stroke-width="1.3"/>

    <!-- eyes looking down at the screen -->
    <path d="M178 141 C182 138 189 138 193 141"/>
    <path d="M207 141 C211 138 218 138 222 141"/>
    <path d="M181 143 C185 146 189 146 192 143" stroke-width="1.2"/>
    <path d="M208 143 C212 146 216 146 219 143" stroke-width="1.2"/>
    <circle cx="186" cy="144.2" r="1.7" fill="#2a2a2a"/>
    <circle cx="214" cy="144.2" r="1.7" fill="#2a2a2a"/>
    <!-- nose + calm smile -->
    <path d="M200 146 C199 152 197 156 199 158 C201 159 203 158 204 157"/>
    <path d="M190 164 C195 168 205 168 210 164"/>

    <!-- desk -->
    <path d="M30 300 C120 298 280 299 372 301"/>
    <path d="M36 306 C120 304 280 305 366 307" stroke-width="0.9" opacity=".4"/>

    <!-- laptop seen from behind (lid toward the viewer) -->
    <path d="M132 222 L268 222 L282 296 L118 296 Z" fill="#e6e6e6"/>
    <path d="M108 296 L292 296 L296 302 L104 302 Z" fill="#e6e6e6"/>
    <!-- lid shading -->
    <path d="M140 286 L148 232 M152 288 L158 240 M262 288 L256 242 M272 290 L266 250" stroke-width="0.8" opacity=".35"/>
