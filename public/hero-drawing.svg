<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" role="img" aria-label="Line drawing of Jayson with wired earphones, typing on a laptop">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>

  <g filter="url(#pencil)" fill="none" stroke="#2a2a2a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- shoulders + cardigan (behind laptop) -->
