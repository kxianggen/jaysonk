    <path d="M176 84 C188 76 204 74 218 78" stroke="#fafaf8" stroke-width="1.1" opacity=".55"/>
    <path d="M172 96 C178 108 180 118 179 128 M190 92 C194 104 195 116 193 130 M206 92 C208 104 208 118 206 131 M222 94 C224 106 224 118 222 130" stroke="#fafaf8" stroke-width="0.8" opacity=".35"/>
