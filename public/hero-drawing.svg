    <!-- mug -->
    <path d="M316 266 L318 298 C326 300 338 300 346 298 L348 266"/>
    <path d="M316 266 C324 270 340 270 348 266 C340 262 324 262 316 266"/>
    <path d="M348 274 C358 274 358 290 347 290"/>
    <path d="M326 254 C322 246 330 242 326 234 M338 254 C334 246 342 242 338 234" stroke-width="1" opacity=".55"/>
