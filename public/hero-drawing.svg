    <path d="M186 190 C192 196 208 196 214 190"/>
    <path d="M178 193 L200 226 L222 193"/>
    <path d="M200 226 L200 240" opacity=".6"/>
    <circle cx="200" cy="233" r="1.4" fill="#2a2a2a"/>
